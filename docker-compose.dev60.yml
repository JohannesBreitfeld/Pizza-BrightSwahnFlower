networks:
  pizza-network:
    driver: bridge

volumes:
  cosmosdb_data:
  rabbitmq_data:
  sqlserver_data:

services:
  gateway:
    build:
      context: ./PizzaGateway/PizzaGateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - orderservice
      - identity
    restart: on-failure
    networks:
      - pizza-network

  orderservice:
    build:
      context: ./OrderService
      dockerfile: OrderService.Api/Dockerfile
    container_name: orderservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - CosmosDb__HttpClientFactory=true
    depends_on:
      cosmosdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - pizza-network

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: cosmosdb
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    volumes:
      - cosmosdb_data:/data/db
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  emailservice:
    build:
      context: ./PizzaMail/PizzaMail
      dockerfile: Dockerfile
    container_name: emailservice
    environment:
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - AzureWebJobsStorage=UseDevelopmentStorage=true
      - RABBITMQ_CONNECTION=amqp://guest:guest@rabbitmq:5672/
      - MAILERSEND_API_KEY=REDACTED_API_KEY
      - MAILERSEND_FROM_EMAIL=pizza@test-zxk54v8vozpljy6v.mlsender.net
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pizza-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pizza-network

  identity:
    build:
      context: ./PizzaIdentity
      dockerfile: Identity.Api/Dockerfile
    container_name: identity
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PizzaIdentity;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;MultipleActiveResultSets=true
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure
    networks:
      - pizza-network

  pizzafrontend:
    build:
      context: ./PizzaFrontend/PizzaFrontend
      dockerfile: Dockerfile
    container_name: pizzafrontend
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - REACT_APP_API_GATEWAY_URL=http://gateway:8080
      - GatewayUrl=http://gateway:8080
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - gateway
    restart: on-failure
    networks:
      - pizza-network

  pizzainformationservice:
    build:
      context: ./PizzaInformationService
      dockerfile: PizzaInformationService.Api/Dockerfile
    container_name: pizzainformationservice
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - sql__HttpClientFactory=true
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PizzaInformationDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;MultipleActiveResultSets=true
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure
    networks:
      - pizza-network

